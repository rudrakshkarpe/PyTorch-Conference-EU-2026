<svg xmlns="http://www.w3.org/2000/svg" width="960" height="688" viewBox="0 0 960 688" role="img" aria-labelledby="title desc">
<title id="title">RLM inference loop</title>
<desc id="desc">Long input is loaded into persistent REPL state. The root model receives metadata, generates code, and receives bounded feedback. Code can make sub-calls on selected text and retain their results. A final answer is returned from state. This is the paper’s conceptual algorithm, not a claim of unlimited recursion in this benchmark.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#202b33"/></marker></defs>
<style>@media (prefers-color-scheme: dark) {[fill="#202b33"] {fill:#e6edf3}[stroke="#202b33"] {stroke:#e6edf3}[fill="#56646f"] {fill:#aab7c4}[stroke="#c7cfd4"] {stroke:#465462}[fill="#285e83"] {fill:#91c5ed}[stroke="#285e83"] {stroke:#6b9cbe}[fill="#eef5fa"] {fill:#172b3b}[fill="#326754"] {fill:#9cd6bc}[stroke="#326754"] {stroke:#649b82}[fill="#eff6f1"] {fill:#172e25}[fill="#fff"] {fill:#161b22}[fill="#fafbfc"] {fill:#111820}}</style>
<text x="32" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#56646f" text-anchor="start">01 / RLM INFERENCE</text>
<text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202b33" text-anchor="start">Long input lives in the program’s state</text>
<text x="32" y="99" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#56646f" text-anchor="start">Conceptual loop from Zhang et al., §2 / Algorithm 1. Serving details are in Figure 2.</text>
<path d="M32 120 H928" stroke="#c7cfd4" stroke-width="1"/>
<text x="688" y="159" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#202b33" text-anchor="middle">Long input P</text>
<path d="M688 170 V219" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="704" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">load once</text>
<rect x="42" y="220" width="294" height="168" rx="4" fill="#eef5fa" stroke="#285e83" stroke-width="1.5"/>
<text x="62" y="251" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#285e83" text-anchor="start">Root language model</text>
<text x="62" y="281" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#202b33" text-anchor="start">Task + input metadata</text>
<text x="62" y="307" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#202b33" text-anchor="start">Code and feedback history</text>
<text x="62" y="359" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">Each call has a finite context window.</text>
<rect x="548" y="220" width="380" height="168" rx="4" fill="#eff6f1" stroke="#326754" stroke-width="1.5"/>
<text x="568" y="251" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#326754" text-anchor="start">Persistent Python REPL</text>
<text x="568" y="281" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#202b33" text-anchor="start">P · selected slices · intermediate values</text>
<text x="568" y="307" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#202b33" text-anchor="start">Execute code; retain state across turns</text>
<text x="568" y="359" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">Full input is available through variables.</text>
<path d="M336 275 H548" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="442" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202b33" text-anchor="middle">generated code</text>
<path d="M548 330 H336" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="442" y="319" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202b33" text-anchor="middle">bounded feedback</text>
<path d="M585 220 V183 H189 V220" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="375" y="172" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="middle">initial input metadata</text>
<rect x="548" y="466" width="380" height="107" rx="4" fill="#eef5fa" stroke="#285e83" stroke-width="1.5"/>
<text x="568" y="498" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#285e83" text-anchor="start">Sub-call on a constructed prompt</text>
<text x="568" y="526" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#202b33" text-anchor="start">Selected text or a transformed subproblem</text>
<text x="568" y="551" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#56646f" text-anchor="start">May recurse if the runtime permits it</text>
<path d="M614 388 V466" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="602" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="end">prompt</text>
<path d="M858 466 V388" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="871" y="438" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">result</text>
<path d="M548 367 H505 V518 H336" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="491" y="483" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="end">finish</text>
<rect x="42" y="485" width="294" height="68" rx="4" fill="#fff" stroke="#c7cfd4" stroke-width="1.5"/>
<text x="62" y="513" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202b33" text-anchor="start">Return final answer</text>
<text x="62" y="538" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">Read the completed result from state</text>
<path d="M32 605 H928" stroke="#c7cfd4" stroke-width="1"/>
<text x="32" y="635" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#202b33" text-anchor="start">The full input stays outside the root prompt; selected excerpts can still enter model calls.</text>
<text x="32" y="661" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#56646f" text-anchor="start">History can grow across turns. This is programmatic decomposition, not an unlimited model window.</text>
</svg>
