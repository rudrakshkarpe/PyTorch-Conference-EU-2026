<text x="780.0" y="403.0" text-anchor="middle" fill="#045878" font-family="Inter, Liberation Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="800">4</text>
<text x="810.0" y="403.0" text-anchor="start" fill="#044868" font-family="Inter, Liberation Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="600">Returns Python code blocks</text>
