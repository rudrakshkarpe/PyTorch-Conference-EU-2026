<text x="1126.0" y="634.0" text-anchor="middle" fill="#6A2E10" font-family="Inter, Liberation Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="800">sub_RLM() recursive calls</text>
<text x="1126.0" y="660.0" text-anchor="middle" fill="#6A2E10" font-family="Inter, Liberation Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="600">REPL code can spawn GPU passes in a loop</text>
