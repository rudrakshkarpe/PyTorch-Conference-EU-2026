<rect x="48.0" y="732.0" width="1304.0" height="88.0" rx="16" ry="16" fill="#FFFFFF" stroke="#C8C8C8" stroke-width="2.0"/>
<text x="700.0" y="770.0" text-anchor="middle" fill="#1A1A1A" font-family="Inter, Liberation Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700">Recursion is program control flow in the REPL, not extra transformer layers.</text>
<text x="700.0" y="798.0" text-anchor="middle" fill="#555555" font-family="Inter, Liberation Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600">PyTorch / vLLM runs one generate() per root step and per sub-call.</text>
