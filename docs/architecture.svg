<svg xmlns="http://www.w3.org/2000/svg" width="960" height="733" viewBox="0 0 960 733" role="img" aria-labelledby="title desc">
<title id="title">Benchmark implementation and measurement boundaries</title>
<desc id="desc">OOLONG samples enter a sequential Python benchmark runner. It calls the upstream RLM runtime with a local REPL, 30 root iterations and max depth 1. Root and leaf sub-call requests share a vLLM endpoint running one checkpoint on one H100. The harness records scores, timing, usage and trajectory data, and polls device memory. Dashed arrows show measurement paths.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#202b33"/></marker></defs>
<rect width="960" height="733" fill="#ffffff"/>
<text x="32" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#56646f" text-anchor="start">02 / BENCHMARK IMPLEMENTATION</text>
<text x="32" y="70" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202b33" text-anchor="start">One Python harness, one model server</text>
<text x="32" y="99" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#56646f" text-anchor="start">Root and sub-call requests use the same configured endpoint and checkpoint.</text>
<path d="M32 120 H928" stroke="#c7cfd4" stroke-width="1"/>
<text x="42" y="153" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#56646f" text-anchor="start">PYTHON HOST PROCESS</text>
<text x="702" y="153" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#56646f" text-anchor="start">vLLM MODEL SERVER</text>
<rect x="32" y="170" width="602" height="281" rx="4" fill="#fafbfc" stroke="#c7cfd4" stroke-width="1.5"/>
<rect x="54" y="194" width="230" height="68" rx="4" fill="#fff" stroke="#c7cfd4" stroke-width="1.5"/>
<text x="70" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202b33" text-anchor="start">OOLONG-synth</text>
<text x="70" y="244" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">Filtered, sorted test samples</text>
<path d="M169 262 V313" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="184" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">prompt + question</text>
<rect x="54" y="313" width="230" height="109" rx="4" fill="#fff" stroke="#c7cfd4" stroke-width="1.5"/>
<text x="70" y="342" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202b33" text-anchor="start">Benchmark runner</text>
<text x="70" y="370" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#202b33" text-anchor="start">One sample at a time</text>
<text x="70" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">run_benchmark.py</text>
<rect x="356" y="194" width="256" height="228" rx="4" fill="#eff6f1" stroke="#326754" stroke-width="1.5"/>
<text x="374" y="226" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#326754" text-anchor="start">Upstream RLM runtime</text>
<text x="374" y="255" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#202b33" text-anchor="start">Root history + local REPL</text>
<text x="374" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#202b33" text-anchor="start">Constructs model requests</text>
<path d="M374 302 H594" stroke="#c7cfd4" stroke-width="1"/>
<text x="374" y="329" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202b33" text-anchor="start">max_iterations = 30</text>
<text x="374" y="355" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202b33" text-anchor="start">max_depth = 1</text>
<text x="374" y="395" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">Sub-calls are leaf LM calls.*</text>
<path d="M284 335 H356" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="320" y="323" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#56646f" text-anchor="middle">call</text>
<path d="M356 390 H284" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="320" y="381" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#56646f" text-anchor="middle">return</text>
<rect x="702" y="170" width="226" height="281" rx="4" fill="#eef5fa" stroke="#285e83" stroke-width="1.5"/>
<text x="720" y="204" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#285e83" text-anchor="start">OpenAI-compatible API</text>
<text x="720" y="235" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#202b33" text-anchor="start">vLLM scheduler</text>
<text x="720" y="263" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202b33" text-anchor="start">Model weights + KV cache</text>
<text x="720" y="299" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202b33" text-anchor="start">PyTorch / CUDA execution</text>
<path d="M720 322 H910" stroke="#c7cfd4" stroke-width="1"/>
<text x="720" y="351" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#202b33" text-anchor="start">1 × NVIDIA H100 80 GB</text>
<text x="720" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202b33" text-anchor="start">bfloat16 · 32,768 tokens</text>
<text x="720" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">One checkpoint per run</text>
<path d="M612 239 H702" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="657" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#56646f" text-anchor="middle">requests</text>
<path d="M702 286 H612" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="657" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#56646f" text-anchor="middle">responses</text>
<rect x="54" y="524" width="558" height="95" rx="4" fill="#fff" stroke="#c7cfd4" stroke-width="1.5"/>
<text x="72" y="554" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#202b33" text-anchor="start">Score and record each sample</text>
<text x="72" y="582" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202b33" text-anchor="start">Answer score · elapsed time · usage / trajectory · GPU memory</text>
<text x="72" y="605" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">JSON results → plot_results.py → five charts</text>
<path d="M169 422 V524" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="182" y="488" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="start">completion + timing</text>
<path d="M815 451 V567 H612" fill="none" stroke="#202b33" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="724" y="551" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#56646f" text-anchor="middle">VRAM poll / 0.5 s</text>
<path d="M32 650 H928" stroke="#c7cfd4" stroke-width="1"/>
<text x="32" y="680" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#56646f" text-anchor="start">* In the upstream implementation reviewed; dependency versions are not pinned here.</text>
<text x="32" y="706" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#56646f" text-anchor="start">Solid arrows: calls and returned data. Dashed arrows: measurements collected by this repository.</text>
</svg>
